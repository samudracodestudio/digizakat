name: Update Live OPZ News

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Enable manual run button

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 lxml

      - name: Crawl Live Feeds & Sync SIMZAT Directory
        run: |
          python scripts/fetch_live_news.py
          python scripts/sync_simzat_laz.py

      - name: Commit and Push if updated
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/live_news.json public/data/archive_news.json public/data/laz_verified.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Automated OPZ news wire & SIMZAT directory update"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: update-feed
    if: needs.update-feed.outputs.updated == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
